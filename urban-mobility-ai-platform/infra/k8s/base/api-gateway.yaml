apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: urban-mobility
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/motofix/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mobility-platform-config
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: firebase-config
                  key: project_id
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-jwt
                  key: secret
            - name: FIREBASE_ADMIN_CREDENTIALS_B64
              valueFrom:
                secretKeyRef:
                  name: firebase-admin
                  key: credentials_b64
            - name: AUTH_SERVICE_URL
              value: "http://auth-service"
            - name: USER_SERVICE_URL
              value: "http://user-service"
            - name: DRIVER_SERVICE_URL
              value: "http://driver-service"
            - name: TRIP_SERVICE_URL
              value: "http://trip-service"
            - name: DISPATCH_SERVICE_URL
              value: "http://dispatch-service"
            - name: AI_SERVICE_URL
              value: "http://ai-dispatch-brain"
            - name: GEO_SERVICE_URL
              value: "http://geo-service"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: urban-mobility
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080

