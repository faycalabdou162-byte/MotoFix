apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: urban-mobility
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
        - name: trip-service
          image: ghcr.io/motofix/trip-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mobility-platform-config
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: firebase-config
                  key: project_id
            - name: FIREBASE_ADMIN_CREDENTIALS_B64
              valueFrom:
                secretKeyRef:
                  name: firebase-admin
                  key: credentials_b64
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: urban-mobility
spec:
  selector:
    app: trip-service
  ports:
    - port: 80
      targetPort: 8080

